name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Publish APK
        run: dotnet publish osu.Android/osu.Android.csproj -c Release -f net10.0-android -r android-arm64 -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: osu-android-apk
          path: osu.Android/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 14
